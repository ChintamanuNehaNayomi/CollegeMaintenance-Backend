spring.application.name=project

spring.datasource.url=${DB_URL:jdbc:mysql://college-maintenance-db-college-maintenance.l.aivencloud.com:12591/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keep the existing non-destructive schema update behavior.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.root=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor=INFO

app.jwt.secret=${JWT_SECRET:CampusCareLocalDevelopmentSecretKey2026Secure}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,https://collegemaintenance-fronted.vercel.app}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

server.port=${PORT:8080}
